services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-10.6}
    container_name: benchpress-mariadb
    hostname: benchpress-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    # Flags, not a mounted .cnf: this file is run from inside the backend container, so a
    # relative bind reaches the host daemon as a path the host does not have. See
    # tests/test_shared_compose.py.
    command: >
      mariadbd
      --max-connections=500
      --innodb-buffer-pool-size=128M
      --key-buffer-size=16M
    volumes:
      - mariadb-data:/var/lib/mysql
    mem_limit: ${MARIADB_MEM_LIMIT:-1g}
    networks:
      - benchpress

  redis:
    image: redis:7-alpine
    container_name: benchpress-redis
    hostname: benchpress-redis
    restart: always
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    mem_limit: 512m
    networks:
      - benchpress

volumes:
  mariadb-data:
    name: benchpress-mariadb-data
    external: true
  redis-data:
    name: benchpress-redis-data

networks:
  benchpress:
    name: benchpress
    external: true
