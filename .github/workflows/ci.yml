name: CI

on:
  push:
    branches:
      - version-16
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# dorny/paths-filter needs pull-requests: read to list PR files; without an
# explicit block a read-only default token makes Detect Changes fail with
# "Resource not accessible by integration", which skips Server and Frontend.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-benchpress-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job-level filtering instead of workflow-level paths-ignore: Server and
  # Frontend are required checks on version-16, and a workflow that never runs
  # leaves them pending forever, while a skipped job counts as passing.
  changes:
    runs-on: ubuntu-latest
    name: Detect Changes
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          filters: |
            # A docs-only pull request must not wake the 60-minute Server
            # job. `!**/*.md` never stopped it: docs/ holds 40 .mdx and 57
            # images, and docs-site/ ships .txt, .json and .xml beside its .md.
            # Exclude the three docs trees whole — the Docs job is ungated and
            # still lints and regenerates the docs trees.
            backend:
              - '**'
              - '!frontend/**'
              - '!docs/**'
              - '!docs-site/**'
              - '!docs-bundle/**'
              - '!**/*.md'
              - '!**/*.mdx'
            frontend:
              - '{frontend/**,.github/workflows/ci.yml}'

  tests:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Check for valid Python & merge conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules --exclude-dir=.claude "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          # --frappe-branch, for the same reason vpn_management is pinned below: bench init
          # defaults to frappe's develop branch, so the suite tracked a branch this app does
          # not ship on and broke on upstream changes no pull request here contained.
          bench init --frappe-branch version-16 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      # benchpress declares required_apps = ["vpn_management"], a public repo,
      # so install-app benchpress only resolves if the app is already on the bench.
      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app https://github.com/NagariaHussain/doppio
          # Pin vpn_management to a reviewed commit so CI is repeatable instead
          # of tracking the moving version-16 branch. Update the SHA only after
          # reviewing the new commit.
          git clone --branch version-16 https://github.com/Venkateshvenki404224/vpn_management.git /tmp/vpn_management
          git -C /tmp/vpn_management checkout 76e0da16a9859e7fa9df1f7a96ae4ab992137ec0
          bench get-app /tmp/vpn_management
          bench get-app benchpress $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app benchpress
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app benchpress
        env:
          TYPE: server

      - name: Page load
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site serve --port 8000 > /tmp/bench-serve.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/api/method/ping && break
            sleep 2
          done
          body=$(curl -fsS -H 'Host: test_site' http://127.0.0.1:8000/frontend) || { cat /tmp/bench-serve.log; exit 1; }
          echo "$body" | grep -q 'id="app"'
          echo "$body" | grep -q '<title>Benchpress'

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    name: Frontend

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # socket.js resolves sites/common_site_config.json from the bench root
      # (two directories above the app) at build time, so the build only works
      # in a bench-shaped tree. Stub it here; remove this step once #28 lands.
      - name: Stub bench site config
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/../../sites"
          echo '{"socketio_port": 9000}' > "${GITHUB_WORKSPACE}/../../sites/common_site_config.json"

      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # `yarn build` only proves the bundle compiles. The vitest suite matched
      # by frontend/vitest.config.js (src/**/*.spec.js) is the only thing that
      # runs the SPA's own logic, and until now nothing ran it.
      - name: Unit tests
        working-directory: frontend
        run: yarn test:run

      - name: Build
        working-directory: frontend
        run: yarn build

  docs:
    runs-on: ubuntu-latest
    name: Docs
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 because generate stamps each page with the commit date
      # that last touched it. A shallow clone has no such commit, so the
      # generated files would differ from the committed ones and drift.
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm

      # --ignore-scripts skips the root postinstall, which runs `yarn install`
      # in frontend/. The docs pipeline never reads the SPA.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Build both generate modes
        run: npm run docs:build

      - name: Lint
        run: npm run docs:lint

      - name: Score
        run: npm run docs:score

      # `git status --porcelain` rather than `git diff`: diff alone misses a
      # generated file that was added but never committed.
      - name: Generated docs are committed and current
        run: |
          if [ -n "$(git status --porcelain -- docs-site docs-bundle)" ]; then
            echo "docs-site/ or docs-bundle/ is stale or hand-edited."
            echo "Run: npm run docs:build && git add docs-site docs-bundle"
            git status --porcelain -- docs-site docs-bundle
            git diff -- docs-site docs-bundle
            exit 1
          fi
